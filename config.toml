baseURL = "https://snikt.net/"
languageCode = "en"
defaultContentLanguage = "en"
siteTitle = "Andreas Happe"
preserveTaxonomyNames = true
enableRobotsTXT = true
enableGitInfo = false
# paginate = 10
disqusShortname = "signalnoise"
theme = ["PaperMod"]

[markup]
  [markup.highlight]
      anchorLineNos = false
      codeFences = true
      guessSyntax = true
      hl_Lines = ""
      lineAnchors = ""
      lineNoStart = 1
      lineNos = true
      lineNumbersInTable = true
      #noClasses = true
      style = "tango"
      tabWidth = 2

[permalinks]
  post = "blog/:year/:month/:day/:title/"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[menu]

[[menu.main]]
  name = "Blog"
  weight = 5
  identifier = "blog"
  url = "/"
[[menu.main]]
  name = "Archives"
  weight = 10
  identifier = "archives"
  url = "/archives"
[[menu.main]]
  name = "Categories"
  weight = 20
  identifier = "categories"
  url = "/categories/"

[params]
  readmore = true

  keywords = ["Andreas Happe", "Happe","Ruby on Rails", "Security", "Tech"]
  description = "Andreas Happe sometimes blogs about development, life or security."

  archivePaginate = 50
  showArchiveCount = false
  dateFormatToUse = "2006-01-02"
  moreMeta = false
  highlightInClient = false
  smartToc = true

[[author]]
  name = "Andreas Happe"

